<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyKomik — Baca Komik Online</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0d14; --surface:#13131e; --surface2:#1a1a28; --surface3:#1f1f30;
  --border:#2a2a40; --accent:#e63946; --accent2:#ffd166; --accent3:#06d6a0;
  --purple:#7c3aed; --text:#e8e8f0; --muted:#6b6b8a; --radius:10px;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;}
.navbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:65px;display:flex;align-items:center;position:sticky;top:0;z-index:100;}
.nav-container{width:100%;display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;color:#fff;text-decoration:none;}
.logo span{color:var(--accent2);}
.nav-links{display:flex;gap:1.5rem;align-items:center;}
.nav-item{color:var(--text);text-decoration:none;font-weight:700;font-size:0.9rem;transition:color 0.2s;cursor:pointer;}
.nav-item:hover{color:var(--accent2);}
.btn-auth{background:var(--accent);color:#fff;padding:6px 14px;border-radius:5px;font-weight:700;font-size:0.85rem;text-decoration:none;cursor:pointer;}
.btn-admin{background:var(--purple);color:#fff;padding:6px 14px;border-radius:5px;font-weight:700;font-size:0.85rem;text-decoration:none;}
.container{max-width:1200px;margin:2rem auto;padding:0 1rem;}
.page{display:none;}.page.active{display:block;}
.user-welcome{background:rgba(124,58,237,0.1);border:1px solid var(--border);padding:10px 1rem;border-radius:8px;margin-bottom:1.5rem;font-size:0.9rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.genre-bar{display:flex;gap:0.5rem;margin-bottom:1.5rem;overflow-x:auto;padding-bottom:5px;}
.genre-chip{background:var(--surface);border:1px solid var(--border);padding:6px 16px;border-radius:20px;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;color:var(--text);}
.genre-chip.active,.genre-chip:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.comic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.5rem;}
.comic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform 0.2s,border-color 0.2s;}
.comic-card:hover{transform:translateY(-5px);border-color:var(--purple);}
.comic-cover{width:100%;height:250px;background:#000;}
.comic-cover-img{width:100%;height:100%;object-fit:cover;}
.comic-info{padding:0.8rem;}
.comic-title{font-weight:800;font-size:0.95rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;color:#fff;}
.comic-genre{font-size:0.75rem;color:var(--muted);font-weight:700;margin-bottom:8px;}
.comic-meta{display:flex;justify-content:space-between;align-items:center;font-size:0.75rem;font-weight:700;}
.comic-rating{color:var(--accent2);}
.comic-chapters{background:rgba(6,214,160,0.15);color:var(--accent3);padding:2px 6px;border-radius:4px;}
.detail-header{display:flex;gap:2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:2rem;}
@media(max-width:768px){.detail-header{flex-direction:column;align-items:center;text-align:center;}}
.detail-cover{width:200px;height:280px;border-radius:6px;overflow:hidden;flex-shrink:0;box-shadow:var(--shadow);}
.detail-cover img{width:100%;height:100%;object-fit:cover;}
.detail-main{display:flex;flex-direction:column;justify-content:center;flex:1;}
.detail-title{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:#fff;margin-bottom:0.5rem;letter-spacing:1px;}
.detail-genre{background:var(--purple);color:#fff;padding:3px 10px;border-radius:4px;font-size:0.8rem;font-weight:700;align-self:flex-start;margin-bottom:1rem;}
.detail-synopsis{color:var(--text);font-size:0.9rem;line-height:1.6;margin-bottom:1.5rem;}
.detail-status{font-size:0.85rem;color:var(--muted);margin-bottom:1rem;}
.btn-bookmark{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:#fff;font-weight:700;font-size:0.88rem;cursor:pointer;transition:all 0.2s;align-self:flex-start;}
.btn-bookmark:hover{border-color:var(--accent2);color:var(--accent2);}
.btn-bookmark.bookmarked{background:rgba(255,209,102,0.15);color:var(--accent2);border-color:var(--accent2);}
.chapter-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;}
.section-title{font-weight:800;font-size:1.1rem;color:#fff;margin-bottom:1rem;border-left:4px solid var(--accent);padding-left:8px;}
.chapter-list{display:flex;flex-direction:column;gap:0.5rem;}
.chapter-item{background:var(--surface2);border:1px solid var(--border);padding:12px 1rem;border-radius:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background 0.2s;}
.chapter-item:hover{background:var(--surface3);border-color:var(--purple);}
.chapter-num{font-weight:700;font-size:0.9rem;color:#fff;}
.chapter-date{font-size:0.8rem;color:var(--muted);}
.reader-header{background:var(--surface);border:1px solid var(--border);padding:1rem;border-radius:var(--radius);margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;}
.reader-wrap{display:flex;flex-direction:column;align-items:center;background:#000;padding:0;border-radius:var(--radius);overflow:hidden;}
.reader-page{max-width:800px;width:100%;display:block;height:auto;margin:0;padding:0;border:none;line-height:0;}
.reader-footer{margin-top:2.5rem;width:100%;padding:1rem 0;display:flex;justify-content:center;}
.reader-nav-container{display:inline-flex;align-items:center;gap:16px;background:#07070f;padding:10px 24px;border-radius:40px;border:1px solid var(--border);box-shadow:var(--shadow);}
.btn-round{width:50px;height:50px;border-radius:50%;background:#22222b;border:none;color:#e8e8f0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s ease;outline:none;}
.btn-round:hover{background:var(--purple);color:#fff;transform:scale(1.08);}
.btn-round svg{width:20px;height:20px;fill:currentColor;}
.btn-round.btn-home-accent{background:#1e1e2e;color:var(--accent2);border:1px dashed rgba(255,209,102,0.3);}
.btn-round.btn-home-accent:hover{background:var(--accent);color:#fff;border-color:transparent;}
.comment-section{max-width:800px;width:100%;margin:3rem auto 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;}
.comment-form{margin-top:1rem;margin-bottom:2rem;}
.comment-input{width:100%;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;outline:none;resize:none;min-height:80px;margin-bottom:0.8rem;}
.comment-input:focus{border-color:var(--purple);}
.comment-list{display:flex;flex-direction:column;gap:1rem;}
.comment-item{background:var(--surface2);border:1px solid var(--border);padding:12px;border-radius:8px;}
.comment-meta-user{display:flex;justify-content:space-between;font-size:0.8rem;font-weight:700;margin-bottom:6px;}
.comment-user{color:var(--accent2);}
.comment-date{color:var(--muted);font-weight:400;}
.comment-text{font-size:0.9rem;line-height:1.4;word-break:break-all;}
.empty-state{text-align:center;padding:3rem;color:var(--muted);font-weight:700;width:100%;}
.loading-state{text-align:center;padding:2rem;color:var(--muted);font-weight:700;}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="navbar">
  <div class="nav-container">
    <a href="#" class="logo" onclick="showHome()">My<span>Komik</span></a>
    <div class="nav-links" id="nav-actions">
      <span class="nav-item" onclick="showHome()">🏠 Beranda</span>
      <a href="login.html" class="btn-auth">Masuk</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="user-welcome" id="user-bar" style="display:none;">
    <div>👋 Selamat datang kembali, <span id="user-display-name" style="color:var(--accent2)">Pembaca</span>!</div>

    <div class="genre-bar" id="genre-bar"></div>

    <div class="comic-grid" id="comic-grid"><div class="loading-state">⏳ Memuat komik...</div></div>

    <button class="genre-chip" style="margin-bottom:1rem;" onclick="showHome()">⬅ Kembali Beranda</button>

        <h1 class="detail-title" id="detail-title">Judul Komik</h1>
        <span class="detail-genre" id="detail-genre">Genre</span>
        <p class="detail-synopsis" id="detail-synopsis">Sinopsis cerita...</p>
        <div class="detail-status" id="detail-status-text">Status: -</div>

        <button class="genre-chip active" style="border-radius:6px;" onclick="submitComment()">Kirim Komentar</button>
      </div>
      <div class="comment-list" id="reader-comments-area"></div>
    </div>
  </div>
</div>

<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let COMICS_DATA    = [];
let CHAPTERS_DATA  = [];
let BOOKMARKS_DATA = [];
let currentGenre   = 'semua';
let activeComicId  = null;
let activeChapterNum = null;

// ── UTILITAS ──────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const t = document.getElementById('page-' + name);
  if (t) t.classList.add('active');
  window.scrollTo(0, 0);
}

function loadBookmarks() {
  const session = JSON.parse(localStorage.getItem('MV_CURRENT_USER'));
  BOOKMARKS_DATA = session
    ? (JSON.parse(localStorage.getItem('MV_BOOKMARKS_' + session.username)) || [])
    : [];
}

// ── SESSION & AUTH ────────────────────────────────────────────────
function checkUserSession() {
  const session = JSON.parse(localStorage.getItem('MV_CURRENT_USER'));
  const userBar   = document.getElementById('user-bar');
  const navActions = document.getElementById('nav-actions');
  if (session) {
    userBar.style.display = 'flex';
    document.getElementById('user-display-name').textContent = session.username;
    const adminBtn = session.role === 'admin'
      ? '<a href="admin.html" class="btn-admin">⚙️ Panel Admin</a>' : '';
    navActions.innerHTML = `
      <span class="nav-item" onclick="toggleShowBookmarks()">🔖 Bookmark Saya</span>
      <span class="nav-item" onclick="showHome()">🏠 Beranda</span>
      ${adminBtn}`;
  } else {
    userBar.style.display = 'none';
    navActions.innerHTML = `
      <span class="nav-item" onclick="showHome()">🏠 Beranda</span>
      <a href="login.html" class="btn-auth">Masuk</a>`;
  }
}

function doLogout() {
  localStorage.removeItem('MV_CURRENT_USER');
  checkUserSession();
  showHome();
}

// ── HOME ──────────────────────────────────────────────────────────
async function showHome() {
  showPage('home');
  currentGenre = 'semua';
  document.getElementById('home-section-title').textContent = '🔥 Jelajahi Komik Populer';
  document.getElementById('comic-grid').innerHTML = '<div class="loading-state">⏳ Memuat komik...</div>';

  const { data, error } = await db.from('comics').select('*').order('id', { ascending: false });
  if (error) {
    document.getElementById('comic-grid').innerHTML = '<div class="empty-state">❌ Gagal memuat komik. Cek konfigurasi Supabase.</div>';
    return;
  }
  COMICS_DATA = data || [];
  renderHome();
}

function renderHome() {
  renderGenreBar();
  const filtered = currentGenre === 'semua'
    ? COMICS_DATA
    : COMICS_DATA.filter(c => c.genre === currentGenre);
  renderComicGrid(filtered);
}

function renderGenreBar() {
  const genres = ['semua','Action','Romance','Fantasy','Comedy','Sci-Fi'];
  document.getElementById('genre-bar').innerHTML = genres.map(g =>
    `<div class="genre-chip ${currentGenre===g?'active':''}" onclick="setGenre('${g}')">${g}</div>`
  ).join('');
}

function setGenre(g) {
  currentGenre = g;
  renderGenreBar();
  document.getElementById('home-section-title').textContent =
    g === 'semua' ? '🔥 Jelajahi Komik Populer' : '📚 Genre: ' + g;
  renderComicGrid(g === 'semua' ? COMICS_DATA : COMICS_DATA.filter(c => c.genre === g));
}

function toggleShowBookmarks() {
  loadBookmarks();
  const filtered = COMICS_DATA.filter(c => BOOKMARKS_DATA.includes(c.id));
  document.getElementById('home-section-title').textContent = '🔖 Koleksi Bookmark Saya';
  renderComicGrid(filtered);
  showPage('home');
}

function renderComicGrid(data) {
  const el = document.getElementById('comic-grid');
  if (!data || data.length === 0) {
    el.innerHTML = '<div class="empty-state">Tidak ada komik ditemukan dalam daftar ini.</div>';
    return;
  }
  el.innerHTML = data.map(c => `
    <div class="comic-card" onclick="openDetail(${c.id})">
      <div class="comic-cover">
        <img class="comic-cover-img" src="${c.cover}"
          onerror="this.src='https://via.placeholder.com/200x250/13131e/6b6b8a?text=MyKomik'">
      </div>
      <div class="comic-info">
        <div class="comic-title">${c.judul}</div>
        <div class="comic-genre">${c.genre}</div>
        <div class="comic-meta">
          <span class="comic-rating">⭐ 4.9</span>
          <span class="comic-chapters" id="chcount-${c.id}">... Ch</span>
        </div>
      </div>
    </div>
  `).join('');
  loadChapterCounts(data);
}

async function loadChapterCounts(comics) {
  for (const c of comics) {
    const { count } = await db.from('chapters').select('id', { count: 'exact', head: true }).eq('comic_id', c.id);
    const el = document.getElementById('chcount-' + c.id);
    if (el) el.textContent = (count || 0) + ' Ch';
  }
}

// ── DETAIL ────────────────────────────────────────────────────────
async function openDetail(id) {
  activeComicId = id;
  loadBookmarks();
  showPage('detail');
  document.getElementById('chapter-list').innerHTML = '<div class="loading-state">⏳ Memuat chapter...</div>';

  const comic = COMICS_DATA.find(c => c.id === id);
  if (!comic) return;

  const { data: chapters } = await db.from('chapters').select('*').eq('comic_id', id).order('number', { ascending: false });
  CHAPTERS_DATA = chapters || [];

  document.getElementById('detail-cover-img').src  = comic.cover;
  document.getElementById('detail-title').textContent   = comic.judul;
  document.getElementById('detail-genre').textContent   = comic.genre;
  document.getElementById('detail-synopsis').textContent = comic.sinopsis || '';
  document.getElementById('detail-status-text').innerHTML = '<strong>Status:</strong> ' + comic.status.toUpperCase();

  const btnBook = document.getElementById('btn-bookmark-action');
  if (BOOKMARKS_DATA.includes(id)) {
    btnBook.className = 'btn-bookmark bookmarked';
    btnBook.textContent = '❤️ Tersimpan di Bookmark';
  } else {
    btnBook.className = 'btn-bookmark';
    btnBook.textContent = '🔖 Simpan Ke Bookmark';
  }

  const listEl = document.getElementById('chapter-list');
  if (CHAPTERS_DATA.length === 0) {
    listEl.innerHTML = '<div style="color:var(--muted);padding:1rem 0;">Belum ada chapter terunggah.</div>';
  } else {
    listEl.innerHTML = CHAPTERS_DATA.map(ch => `
      <div class="chapter-item" onclick="openReader(${comic.id}, ${ch.number})">
        <span class="chapter-num">Chapter ${ch.number}${ch.title ? ' - ' + ch.title : ''}</span>
        <span class="chapter-date">📄 ${ch.pages ? ch.pages.length : 0} Halaman</span>
      </div>
    `).join('');
  }
}

function toggleBookmark() {
  const session = JSON.parse(localStorage.getItem('MV_CURRENT_USER'));
  if (!session) { alert('Anda harus login terlebih dahulu!'); window.location.href='login.html'; return; }
  const key = 'MV_BOOKMARKS_' + session.username;
  let bm = JSON.parse(localStorage.getItem(key)) || [];
  if (bm.includes(activeComicId)) {
    bm = bm.filter(i => i !== activeComicId);
    alert('Komik dihapus dari bookmark.');
  } else {
    bm.push(activeComicId);
    alert('Komik disimpan ke bookmark!');
  }
  localStorage.setItem(key, JSON.stringify(bm));
  openDetail(activeComicId);
}

// ── READER ────────────────────────────────────────────────────────
async function openReader(comicId, chapterNum) {
  activeComicId    = comicId;
  activeChapterNum = chapterNum;

  const comic = COMICS_DATA.find(c => c.id === comicId);
  if (!CHAPTERS_DATA.length || CHAPTERS_DATA[0].comic_id !== comicId) {
    const { data } = await db.from('chapters').select('*').eq('comic_id', comicId).order('number');
    CHAPTERS_DATA = data || [];
  }
  const chapter = CHAPTERS_DATA.find(ch => ch.comic_id === comicId && ch.number === chapterNum);

  if (!chapter || !chapter.pages || chapter.pages.length === 0) {
    alert('Gagal memuat halaman chapter ini.'); return;
  }

  document.getElementById('reader-title').textContent = comic.judul + ' — Chapter ' + chapter.number;
  document.getElementById('reader-back-btn').onclick = () => openDetail(comicId);

  document.getElementById('reader-pages').innerHTML = chapter.pages
    .filter(u => u && u.trim())
    .map((u, k) => `<img class="reader-page" src="${u.trim()}" alt="Halaman ${k+1}"
      onerror="this.src='https://via.placeholder.com/800x1000/1a1a28/ef4444?text=Gagal+Memuat+Gambar'">`)
    .join('');

  const prevExists = CHAPTERS_DATA.some(ch => ch.comic_id===comicId && ch.number===chapterNum-1);
  const nextExists = CHAPTERS_DATA.some(ch => ch.comic_id===comicId && ch.number===chapterNum+1);

  const iL = `<svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>`;
  const iM = `<svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>`;
  const iR = `<svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>`;

  let nav = '<div class="reader-nav-container">';
  if (prevExists) nav += `<button class="btn-round" onclick="openReader(${comicId},${chapterNum-1})">${iL}</button>`;
  nav += `<button class="btn-round btn-home-accent" onclick="openDetail(${comicId})">${iM}</button>`;
  if (nextExists) nav += `<button class="btn-round" onclick="openReader(${comicId},${chapterNum+1})">${iR}</button>`;
  nav += '</div>';
  document.getElementById('reader-navigation-box').innerHTML = nav;

  await renderCommentsList();
  showPage('reader');
}

// ── KOMENTAR ──────────────────────────────────────────────────────
async function renderCommentsList() {
  const area = document.getElementById('reader-comments-area');
  area.innerHTML = '<div style="color:var(--muted);font-size:0.88rem;text-align:center;padding:1rem 0;">⏳ Memuat komentar...</div>';

  const { data } = await db.from('comments')
    .select('*')
    .eq('comic_id', activeComicId)
    .eq('chapter_num', activeChapterNum)
    .order('created_at', { ascending: true });

  if (!data || data.length === 0) {
    area.innerHTML = '<div style="color:var(--muted);font-size:0.88rem;text-align:center;padding:1rem 0;">Belum ada komentar. Jadilah yang pertama!</div>';
    return;
  }
  area.innerHTML = data.map(c => `
    <div class="comment-item">
      <div class="comment-meta-user">
        <span class="comment-user">@${c.username}</span>
        <span class="comment-date">${c.date || 'Baru Saja'}</span>
      </div>
      <div class="comment-text">${c.text}</div>
    </div>
  `).join('');
}

async function submitComment() {
  const session = JSON.parse(localStorage.getItem('MV_CURRENT_USER'));
  if (!session) { alert('Anda harus login terlebih dahulu!'); window.location.href='login.html'; return; }
  const input = document.getElementById('c-input-text');
  const text  = input.value.trim();
  if (!text) { alert('Isi komentar tidak boleh kosong!'); return; }

  const now = new Date();
  const dateStr = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});

  const { error } = await db.from('comments').insert({
    comic_id:    activeComicId,
    chapter_num: activeChapterNum,
    username:    session.username,
    text,
    date: dateStr
  });

  if (error) { alert('Gagal mengirim komentar: ' + error.message); return; }
  input.value = '';
  await renderCommentsList();
}
