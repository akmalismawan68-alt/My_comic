<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — MyKomik</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070f;--surface:#0f0f1a;--border:#1e1e32;--purple:#7c3aed;--purple2:#a855f7;--accent2:#ffd166;--text:#e8e8f0;--muted:#6b6b8a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--surface);border:1px solid var(--border);padding:2.5rem;border-radius:12px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,0.7);border-top:4px solid var(--purple);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2.3rem;text-align:center;letter-spacing:3px;margin-bottom:0.2rem;color:#fff;}
.logo span{color:var(--accent2);}
.badge{text-align:center;font-size:0.65rem;color:var(--purple2);font-weight:800;letter-spacing:2px;margin-bottom:2rem;text-transform:uppercase;}
label{display:block;font-size:0.8rem;font-weight:700;margin-bottom:5px;color:var(--muted);text-transform:uppercase;}
.finput{width:100%;padding:10px 14px;background:#141420;border:1px solid var(--border);border-radius:8px;color:var(--text);margin-bottom:1.5rem;outline:none;font-family:inherit;}
.finput:focus{border-color:var(--purple2);}
.btn{width:100%;padding:12px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-family:inherit;font-size:0.95rem;transition:background 0.2s;}
.btn:hover{background:var(--purple2);}
.btn:disabled{background:var(--muted);cursor:not-allowed;}
.err-msg{background:rgba(230,57,70,0.1);color:#e63946;padding:10px;border-radius:6px;font-size:0.8rem;font-weight:700;margin-bottom:1.2rem;display:none;border:1px solid rgba(230,57,70,0.2);}
.back-link{text-align:center;margin-top:1.5rem;font-size:0.8rem;}
.back-link a{color:var(--muted);text-decoration:none;}
.back-link a:hover{color:var(--text);}
</style>
</head>
<body>

<!-- ================================================================

     ================================================================ -->
<script>
const SUPABASE_URL = 'https://nvjliidqtzhqgqclhbwt.supabase.co/rest/v1/';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52amxpaWRxdHpocWdxY2xoYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTQ5NzUsImV4cCI6MjA5NjA3MDk3NX0.0pv6G84HxVoAXbm2F0diVw_jVNkx-DwDL16lCVjRb0E';
</script>
<!-- ================================================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="login-card">
  <div class="logo">My<span>Komik</span></div>
  <div class="badge">⚡ GERBANG ADMINISTRATOR</div>

  <div class="err-msg" id="a-err"></div>

  <label>Username / Email Admin</label>
  <input type="text" class="finput" id="a-identifier" placeholder="Username atau email admin...">

  <label>Kunci Akses (Password)</label>
  <input type="password" class="finput" id="a-pass" placeholder="••••••••">

  <button class="btn" id="btn-admin-login" onclick="doAdminLogin()">🔐 Masuk ke Dashboard</button>

  <div class="back-link">
    <a href="login.html">← Kembali ke Login Pembaca</a>
  </div>
</div>

<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Kredensial master admin — bisa kamu ganti sesuai kebutuhan
const MASTER_ADMIN_EMAIL = 'admin@MyKomik.com';
const MASTER_ADMIN_PASS  = 'admin123';

async function doAdminLogin() {
  const identifier = document.getElementById('a-identifier').value.trim();
  const pass       = document.getElementById('a-pass').value;
  const err        = document.getElementById('a-err');
  const btn        = document.getElementById('btn-admin-login');
  err.style.display = 'none';

  if (!identifier || !pass) {
    err.textContent = 'Kolom identitas dan password wajib diisi!';
    err.style.display = 'block'; return;
  }

  // 1. Cek master admin hardcoded
  if (identifier === MASTER_ADMIN_EMAIL && pass === MASTER_ADMIN_PASS) {
    localStorage.setItem('MV_CURRENT_USER', JSON.stringify({ username: 'Admin Utama', role: 'admin' }));
    window.location.href = 'admin.html'; return;
  }

  // 2. Cek database Supabase — cari user role admin
  btn.disabled = true; btn.textContent = '⏳ Memproses...';

  const { data: users, error } = await db.from('users')
    .select('*')
    .or(`username.eq.${identifier},email.eq.${identifier}`)
    .eq('password', pass);

  btn.disabled = false; btn.textContent = '🔐 Masuk ke Dashboard';

  if (error || !users || users.length === 0) {
    err.textContent = 'Kredensial salah! Akun tidak ditemukan atau password keliru.';
    err.style.display = 'block'; return;
  }

  const user = users[0];
  if (user.role !== 'admin') {
    err.textContent = 'Akses Ditolak! Akun Anda tidak memiliki otoritas Administrator.';
    err.style.display = 'block'; return;
  }

  localStorage.setItem('MV_CURRENT_USER', JSON.stringify({ username: user.username, role: 'admin' }));
  window.location.href = 'admin.html';
}
</script>
</body>
</html>
