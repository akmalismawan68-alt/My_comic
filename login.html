<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MyKomik</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d14;--surface:#13131e;--surface2:#1a1a28;--border:#2a2a40;--accent:#e63946;--accent2:#ffd166;--text:#e8e8f0;--muted:#6b6b8a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--surface);border:1px solid var(--border);padding:2.5rem;border-radius:12px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;text-align:center;letter-spacing:3px;margin-bottom:2rem;color:#fff;cursor:pointer;}
.logo span{color:var(--accent2);}
.tab-headers{display:flex;gap:10px;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:10px;}
.tab-title{font-weight:800;font-size:1.1rem;cursor:pointer;color:var(--muted);transition:color 0.2s;}
.tab-title.active{color:#fff;position:relative;}
.tab-title.active::after{content:'';position:absolute;bottom:-12px;left:0;width:100%;height:3px;background:var(--accent);border-radius:2px;}
.auth-form{display:none;}.auth-form.active{display:block;}
label{display:block;font-size:0.8rem;font-weight:700;margin-bottom:6px;color:var(--muted);text-transform:uppercase;}
.finput{width:100%;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);margin-bottom:1.2rem;outline:none;font-family:inherit;transition:border 0.2s;}
.finput:focus{border-color:var(--accent);}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-family:inherit;font-size:0.95rem;transition:background 0.2s;margin-top:0.5rem;}
.btn:hover{background:#c1121f;}
.btn:disabled{background:var(--muted);cursor:not-allowed;}
.err-msg{background:rgba(230,57,70,0.1);color:#e63946;padding:10px;border-radius:6px;font-size:0.82rem;font-weight:700;margin-bottom:1.2rem;display:none;border:1px solid rgba(230,57,70,0.2);}
.ok-msg{background:rgba(6,214,160,0.1);color:#06d6a0;padding:10px;border-radius:6px;font-size:0.82rem;font-weight:700;margin-bottom:1.2rem;display:none;border:1px solid rgba(6,214,160,0.2);}
.admin-gateway{text-align:center;margin-top:2rem;font-size:0.8rem;}
.admin-gateway a{color:var(--muted);text-decoration:none;font-weight:700;}
.admin-gateway a:hover{color:var(--accent2);}
</style>
</head>
<body>

<!-- ================================================================

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="login-card">
  <div class="logo" onclick="window.location.href='index.html'">My<span>Komik</span></div>

  <div class="tab-headers">
    <div class="tab-title active" id="t-login" onclick="switchTab('login')">Masuk</div>
    <div class="tab-title" id="t-register" onclick="switchTab('register')">Daftar Akun</div>
  </div>

  <!-- FORM LOGIN -->
  <div class="auth-form active" id="form-login">
    <div class="err-msg" id="l-err"></div>
    <label>Email Pembaca / Username</label>
    <input type="text" class="finput" id="l-email" placeholder="Masukkan username atau email...">
    <label>Password</label>
    <input type="password" class="finput" id="l-pass" placeholder="••••••••">
    <button class="btn" id="btn-login" onclick="doLogin()">🚀 Masuk Ke Akun</button>
  </div>

  <!-- FORM REGISTER -->
  <div class="auth-form" id="form-register">
    <div class="err-msg" id="r-err"></div>
    <div class="ok-msg" id="r-ok"></div>
    <label>Username Unik</label>
    <input type="text" class="finput" id="r-user" placeholder="Contoh: wibu_keren">
    <label>Alamat Email</label>
    <input type="email" class="finput" id="r-email" placeholder="pembaca@email.com">
    <label>Kata Sandi (Minimal 6 Karakter)</label>
    <input type="password" class="finput" id="r-pass" placeholder="••••••••">
    <button class="btn" id="btn-register" onclick="doRegister()">✨ Daftarkan Akun</button>
  </div>

  <div class="admin-gateway">
    <a href="admin-login.html">⚡ Masuk Sebagai Administrator Panel</a>
  </div>
</div>

<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function switchTab(type) {
  document.querySelectorAll('.tab-title').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  if (type === 'login') {
    document.getElementById('t-login').classList.add('active');
    document.getElementById('form-login').classList.add('active');
  } else {
    document.getElementById('t-register').classList.add('active');
    document.getElementById('form-register').classList.add('active');
  }
}

async function doLogin() {
  const identifier = document.getElementById('l-email').value.trim();
  const pass       = document.getElementById('l-pass').value;
  const err        = document.getElementById('l-err');
  const btn        = document.getElementById('btn-login');
  err.style.display = 'none';

  if (!identifier || !pass) {
    err.textContent = 'Seluruh kolom login wajib diisi!';
    err.style.display = 'block'; return;
  }

  btn.disabled = true; btn.textContent = '⏳ Memproses...';

  // Cari user berdasarkan username ATAU email
  const { data: users, error } = await db.from('users')
    .select('*')
    .or(`username.eq.${identifier},email.eq.${identifier}`)
    .eq('password', pass);

  btn.disabled = false; btn.textContent = '🚀 Masuk Ke Akun';

  if (error || !users || users.length === 0) {
    err.textContent = 'Kredensial salah! Akun tidak ditemukan atau password keliru.';
    err.style.display = 'block'; return;
  }

  const user = users[0];
  localStorage.setItem('MV_CURRENT_USER', JSON.stringify({ username: user.username, role: user.role || 'member' }));
  window.location.href = 'index.html';
}

async function doRegister() {
  const username = document.getElementById('r-user').value.trim().replace(/\s+/g, '');
  const email    = document.getElementById('r-email').value.trim();
  const pass     = document.getElementById('r-pass').value;
  const err      = document.getElementById('r-err');
  const ok       = document.getElementById('r-ok');
  const btn      = document.getElementById('btn-register');
  err.style.display = 'none';
  ok.style.display  = 'none';

  if (!username || !email || !pass) {
    err.textContent = 'Semua kolom registrasi wajib diisi!';
    err.style.display = 'block'; return;
  }
  if (pass.length < 6) {
    err.textContent = 'Password minimal terdiri dari 6 karakter.';
    err.style.display = 'block'; return;
  }

  btn.disabled = true; btn.textContent = '⏳ Memproses...';

  // Cek duplikat username atau email
  const { data: existing } = await db.from('users')
    .select('id')
    .or(`username.eq.${username},email.eq.${email}`);

  if (existing && existing.length > 0) {
    btn.disabled = false; btn.textContent = '✨ Daftarkan Akun';
    err.textContent = 'Username atau Email ini sudah terdaftar. Silakan gunakan yang lain.';
    err.style.display = 'block'; return;
  }

  const { error } = await db.from('users').insert({ username, email, password: pass, role: 'member' });

  btn.disabled = false; btn.textContent = '✨ Daftarkan Akun';

  if (error) {
    err.textContent = 'Gagal mendaftar: ' + error.message;
    err.style.display = 'block'; return;
  }

  localStorage.setItem('MV_CURRENT_USER', JSON.stringify({ username, role: 'member' }));
  window.location.href = 'index.html';
}
</script>
</body>
</html>
